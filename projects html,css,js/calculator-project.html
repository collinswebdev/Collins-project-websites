<!DOCTYPE HTML>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> calculator project</title>
    <link rel="stylesheet" href="calculator-project.css">
</head>
    <body>
        <div class="general-div">
            <p id="result" class="result"> 0 </p>
            <div class="num-div">         
                              
                <button id="number7" class="num-btn" >
                    7
                </button>
                <button id="number8" class="num-btn" >
                    8
                </button>
                <button id="number9" class="num-btn" >
                    9
                </button>
                <button id="sign-Division" class="sign-btn"  >
                    ÷
                </button>
                <button id="number4" class="num-btn" >
                    4
                </button>
                <button id="number5" class="num-btn" >
                    5
                </button>
                <button id="number6" class="num-btn" >
                    6
                </button>
                <button id="signMultiply" class="sign-btn" >
                    &#42;
                </button>
                <button id="number1" class="num-btn" >
                    1
                </button>
                <button id="number2" class="num-btn" >
                    2
                </button>
                <button id="number3" class="num-btn" >
                    3
                </button>
                <button id="signMinus" class="sign-btn" >
                    -
                </button>
                <button id="clear" class="clear" >
                    AC
                </button>
                <button id="number0" class="num-btn" >
                    0
                </button>
                <button id="signEquals" class="sign-btn" >
                    =
                </button>
                <button id="signAdd" class="sign-btn" > 
                    + 
                </button>

            </div>
            <div>

            </div>
        </div>

        <script src="calculator-project.js">

        </script>
    </body>
</html>
